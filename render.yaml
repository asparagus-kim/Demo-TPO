# Yielda TPO Demo — Render Blueprint
#
# Deploys the canonical Python backend (`app/`, FastAPI) as a single web service.
# The legacy Jinja demo UI at `/` ships with it, so this one service is a complete,
# demoable product; `frontend/` is a separate Vite build and is NOT deployed here.
#
# After `render blueprints validate`, push and open:
#   https://dashboard.render.com/blueprint/new?repo=<repo-url>
#
# Six keys are marked `sync: false` — Render will not deploy until they are filled
# in the Dashboard. Values live in the local `.env` (git-ignored), never here.

services:
  - type: web
    name: yielda-tpo-api
    runtime: python
    plan: free
    # 서울에서 가장 가까운 리전. 업스트림(국세청·기상청·Kakao)도 모두 한국에 있다.
    region: singapore
    repo: https://github.com/Ali747711/yielda-tpo-demo
    branch: main
    autoDeploy: true

    buildCommand: pip install -r requirements.txt
    # `--port $PORT` is mandatory on Render: the port is assigned at runtime and
    # binding anything else fails the health check with "no open ports detected".
    # Single worker is deliberate — `app/utils/cache.py` is an in-process TTLCache
    # and `places_daily_cap` counts calls per process, so extra workers would
    # multiply the Google Places spend and fragment the analysis cache.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      # Render's python runtime supports 3.8–3.12. Pinned to 3.11 to match the
      # environment the 187-test offline suite passes on.
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ---- Secrets: fill these in the Render Dashboard ----------------------
      # Kakao + OPENAI(Groq) are the two that gate real mode. If either is
      # missing, `Settings.effective_mock_mode()` silently returns True and the
      # service serves fixture data (별빛카페 달빛차) instead of real stores.
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # data.go.kr 인증키 — 국세청(NTS)과 기상청(KMA)이 같은 키를 쓴다.
      # 반드시 **Decoding** 키를 넣어야 한다. Encoding 키는 이중 인코딩되어 401/403.
      - key: DATA_GO_KR_API_KEY
        sync: false
      - key: KMA_API_KEY
        sync: false
      # 상호명 조회. 없으면 매 요청이 needs_input 으로 떨어진다.
      - key: BIZNO_API_KEY
        sync: false
      # 리뷰·영업시간 전담. 없어도 Kakao+웹검색으로 degrade 하므로 파이프라인은 성공한다.
      - key: GOOGLE_MAPS_API_KEY
        sync: false

      # ---- LLM provider ----------------------------------------------------
      # `app/config.py` 가 OPENAI_BASE_URL 을 읽어 클라이언트에 명시적으로 넘긴다.
      # (예전에는 OpenAI SDK 가 환경변수에서 몰래 집어갔고, 어떤 제공자를 쓰는지
      #  코드에 드러나지 않아 장애 추적이 느렸다.) 빠뜨리면 Groq `gsk_` 키가
      # api.openai.com 으로 가서 모든 호출이 401 난다.
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      # Groq 가 llama-3.3-70b-versatile 을 폐기했다(2026-09 확인 · 404).
      # 실패해도 파이프라인은 휴리스틱으로 degrade 해서 success:true 로 나가므로
      # **조용히 품질만 떨어진다** — 모델을 바꿀 때는 반드시 실호출로 확인할 것.
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b

      # ---- Runtime tuning --------------------------------------------------
      - key: MOCK_MODE
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      # Groq 무료 등급은 분당 8000토큰이다. 25건 x 약 507토큰 = 약 12,700 으로
      # 한도를 넘어 429 가 섞인다(그리고 그 리뷰는 휴리스틱으로 떨어진다).
      - key: LLM_REVIEW_CAP
        value: "12"
      # Places API (New) 할당량은 콘솔에서 내릴 수 없어 앱에서 직접 막는다.
      - key: PLACES_DAILY_CAP
        value: "40"
